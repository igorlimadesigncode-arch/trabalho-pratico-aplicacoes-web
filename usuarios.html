<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Usuários de Teste via REST</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
  <style>
    .user-card { width: 210px; }
    .user-avatar { height: 160px; object-fit: cover; }
  </style>
</head>
<body class="container bg-warning py-3">
  <main id="usuarios" class="container-fluid">
    <h1 class="h2">Usuários de Teste via REST</h1>
    <p class="small fst-italic">Os usuários deste exemplo são fornecidos pela API de testes <a href="https://reqres.in/" target="_blank" rel="noopener">reqres.in</a>.</p>
    <p v-if="mensagem" class="small" role="status">{{ mensagem }}</p>
    <div class="row justify-content-center">
      <div class="col-12 col-sm-6 col-lg-4 col-xl-3 p-2 m-1" v-for="(user, index) in users" :key="index">
        <article class="card user-card shadow-sm mx-auto">
          <img class="card-img-top user-avatar" :src="user.avatar" :alt="'Foto de ' + user.first_name + ' ' + user.last_name">
          <div class="card-body">
            <h2 class="card-title h6">{{ user.first_name }} {{ user.last_name }}</h2>
            <p class="card-text small mb-0">{{ user.email }}</p>
          </div>
        </article>
      </div>
    </div>
  </main>
  <script>
    const app = new Vue({
      el: '#usuarios',
      data: function () {
        return { users: [], mensagem: 'Carregando usuários…' };
      },
      mounted: function () {
        this.loadUsers();
      },
      methods: {
        loadUsers: function () {
          const vm = this;
          fetch('https://reqres.in/api/users?per_page=10')
            .then(function (resposta) {
              if (!resposta.ok) throw new Error('A API respondeu com HTTP ' + resposta.status);
              return resposta.json();
            })
            .then(function (dados) {
              if (!Array.isArray(dados.data)) throw new Error('Formato de resposta inesperado');
              vm.users = dados.data;
              vm.mensagem = 'Os usuários foram carregados da API reqres.in.';
            })
            .catch(function () {
              vm.users = [
                { first_name: 'George', last_name: 'Bluth', email: 'george.bluth@reqres.in', avatar: 'https://reqres.in/img/faces/1-image.jpg' },
                { first_name: 'Janet', last_name: 'Weaver', email: 'janet.weaver@reqres.in', avatar: 'https://reqres.in/img/faces/2-image.jpg' },
                { first_name: 'Emma', last_name: 'Wong', email: 'emma.wong@reqres.in', avatar: 'https://reqres.in/img/faces/3-image.jpg' }
              ];
              vm.mensagem = 'A API não respondeu. Exibindo dados de demonstração.';
            });
        }
      }
    });
  </script>
</body>
</html>
