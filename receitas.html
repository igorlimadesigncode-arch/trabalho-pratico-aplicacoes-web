<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo de Receitas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .receita-card { width: 250px; }
    .receita-img { height: 135px; object-fit: cover; }
    .receita-texto { text-align: justify; }
  </style>
</head>
<body onload="preencheCatalogo()">
  <main class="container-fluid py-3">
    <h1 class="mb-3">Catálogo de Receitas</h1>
    <div id="pnlCatalogo" class="d-flex flex-wrap gap-3 bg-warning p-2 rounded"></div>
  </main>
  <script>
    const receitas = [
      {
        titulo: 'Arroz de Couve-Flor',
        imagem: 'assets/arroz-couve-flor.svg',
        preparo: 'Deixe a couve-flor picada. Adicione os ingredientes e refogue bem. Adicione sal, tampe a panela e deixe cozinhar.',
        ingredientes: ['Arroz', 'Couve-flor', 'Cebola média', 'Azeite']
      },
      {
        titulo: 'Bolo de Café',
        imagem: 'assets/bolo-cafe.svg',
        preparo: 'Bata o açúcar, as gemas e o café. Adicione farinha e chocolate e mexa bem. Bata as claras em neve e junte à mistura.',
        ingredientes: ['Farinha de trigo', 'Açúcar', 'Café coado', 'Chocolate em pó', 'Ovos']
      },
      {
        titulo: 'Coxinha de Brigadeiro',
        imagem: 'assets/brigadeiro-morango.svg',
        preparo: 'Junte o leite condensado, chocolate em pó e manteiga. Aqueça no fogo baixo. Envolva os morangos e passe no granulado.',
        ingredientes: ['Leite condensado', 'Chocolate em pó', 'Manteiga', 'Morango', 'Chocolate granulado']
      }
    ];

    const getListaIngredientes = (receita) => {
      let texto = '<ul>';
      texto += receita.ingredientes.map((ingrediente) => `<li>${ingrediente}</li>`).reduce((acumulado, item) => acumulado + item, '');
      texto += '</ul>';
      return texto;
    };

    const getCard = (receita) => `
      <article class="card receita-card shadow-sm">
        <img src="${receita.imagem}" class="card-img-top receita-img" alt="${receita.titulo}" loading="lazy">
        <div class="card-body">
          <h2 class="card-title h5">${receita.titulo}</h2>
          <div class="card-text receita-texto">${getListaIngredientes(receita)}<hr><p class="mb-0">${receita.preparo}</p></div>
        </div>
      </article>`;

    function preencheCatalogo() {
      const painel = document.getElementById('pnlCatalogo');
      painel.innerHTML = receitas.map((receita) => getCard(receita)).reduce((html, card) => html + card, '');
    }
  </script>
</body>
</html>
