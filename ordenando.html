<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ordenando Valores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="ordenando.js" defer></script>
</head>
<body class="container py-4">
  <main class="row g-4">
    <section class="col-md-6">
      <h1 class="h2">Ordenando Valores</h1>
      <label class="form-label" for="valor">Valor</label>
      <input class="form-control mb-2" type="number" id="valor" step="1" placeholder="Digite um número">
      <button class="btn btn-primary" type="button" onclick="add()">Adicionar</button>
      <hr>
      <label class="visually-hidden" for="algoritmo">Algoritmo de ordenação</label>
      <select class="form-select mb-2" id="algoritmo">
        <option value="bubble">Bubble Sort</option>
        <option value="selection">Selection Sort</option>
        <option value="quick">Quick Sort</option>
      </select>
      <button class="btn btn-primary me-2" type="button" onclick="ordenar()">Ordenar</button>
      <button class="btn btn-primary" type="button" onclick="misturar()">Misturar</button>
      <hr>
      <ul id="valores" aria-live="polite"></ul>
    </section>
  </main>
  <script>
    function add() {
      const campo = document.getElementById('valor');
      const lista = document.getElementById('valores');
      if (campo.value.trim() === '') {
        campo.focus();
        return;
      }
      const node = document.createElement('li');
      node.appendChild(document.createTextNode(String(parseInt(campo.value, 10))));
      lista.appendChild(node);
      campo.value = '';
      campo.focus();
    }

    function obterValores() {
      const lista = document.getElementById('valores');
      return Array.from(lista.children, (item) => parseInt(item.innerHTML, 10));
    }

    function renderizarValores(vetor) {
      const lista = document.getElementById('valores');
      lista.innerHTML = vetor.map((valor) => `<li>${valor}</li>`).reduce((html, item) => html + item, '');
    }

    function ordenar() {
      const selecao = document.getElementById('algoritmo');
      const vetor = obterValores();
      if (selecao.selectedIndex === 0) window.bubble_sort(vetor);
      else if (selecao.selectedIndex === 1) window.selection_sort(vetor);
      else window.quick_sort(vetor, 0, vetor.length - 1);
      renderizarValores(vetor);
    }

    function misturar() {
      const vetor = obterValores();
      window.shuffle(vetor, Math.max(vetor.length * 3, 1));
      renderizarValores(vetor);
    }
  </script>
</body>
</html>
